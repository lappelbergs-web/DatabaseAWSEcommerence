<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Order Confirmation - CloudStore</title>
    <link rel="stylesheet" href="/css/style.css" th:href="@{/css/style.css}">
</head>
<body>
<header class="site-header">
    <nav class="site-nav">
        <strong class="brand">CloudStore</strong>

        <a href="/">Home</a>
        <a href="/products">Products</a>

        <a sec:authorize="isAuthenticated()" href="/cart">Cart</a>
        <a sec:authorize="isAuthenticated()" href="/orders">Orders</a>

        <a sec:authorize="isAnonymous()" href="/login">Login</a>
        <a sec:authorize="isAnonymous()" href="/register">Register</a>

        <form sec:authorize="isAuthenticated()" class="nav-form" th:action="@{/logout}" method="post">
            <button class="nav-button" type="submit">Logout</button>
        </form>
    </nav>
</header>

<main>
    <section class="hero">
        <h1>Order Created</h1>

        <div class="order-summary">
            <p>
                Order ID:
                <strong th:text="${order.orderId}">1</strong>
            </p>

            <p>
                User ID:
                <strong th:text="${order.userId}">1</strong>
            </p>

            <p>
                Total:
                $<strong th:text="${order.totalPrice}">0.00</strong>
            </p>
        </div>

        <h2>Items</h2>

        <ul class="order-items">
            <li th:each="item : ${order.items}">
                <span th:text="${item.productTitle}">Product</span>
                -
                Quantity:
                <span th:text="${item.quantity}">1</span>
                -
                Price:
                $<span th:text="${item.productPrice}">0.00</span>
            </li>
        </ul>

        <a class="button" href="/products">Continue Shopping</a>
    </section>
</main>
</body>
</html>
